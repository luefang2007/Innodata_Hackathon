<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1D6FD1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- header -->
  <text x="60" y="72" font-size="38" font-weight="700" fill="#0F172A">Measure, don't claim: the solver sits inside our task factory</text>
  <text x="60" y="110" font-size="20" fill="#475569">pallets/click 8.5.1 to Harbor feature tasks. Blue boxes are what our pipeline adds beyond generate-and-check.</text>

  <!-- pipeline -->
  <g font-size="14.5" fill="#334155">
    <rect x="60" y="150" width="230" height="112" rx="12" fill="#EAF3FE" stroke="#1D6FD1" stroke-width="2"/>
    <text x="78" y="184" font-size="18" font-weight="700" fill="#0F172A">Repo + coverage map</text>
    <text x="78" y="210">click 8.5.1, full suite green</text>
    <text x="78" y="232">which test runs which line</text>

    <rect x="310" y="150" width="230" height="112" rx="12" fill="#EAF3FE" stroke="#1D6FD1" stroke-width="2"/>
    <text x="328" y="184" font-size="18" font-weight="700" fill="#0F172A">Variation matrix</text>
    <text x="328" y="210">6 click areas x 5 behaviour</text>
    <text x="328" y="232">shapes, none repeats in a batch</text>

    <rect x="560" y="150" width="230" height="112" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="578" y="184" font-size="18" font-weight="700" fill="#0F172A">Generate</text>
    <text x="578" y="210">the model writes the spec,</text>
    <text x="578" y="232">the gold patch and the tests</text>

    <rect x="810" y="150" width="230" height="112" rx="12" fill="#EAF3FE" stroke="#1D6FD1" stroke-width="2"/>
    <text x="828" y="184" font-size="18" font-weight="700" fill="#0F172A">8 validity gates</text>
    <text x="828" y="210">gold, base, regression, mutation,</text>
    <text x="828" y="232">fairness, novelty: 30 s, local</text>

    <rect x="1060" y="150" width="230" height="112" rx="12" fill="#1D6FD1" stroke="#1D6FD1" stroke-width="2"/>
    <text x="1078" y="184" font-size="18" font-weight="700" fill="#FFFFFF">Solver jury</text>
    <text x="1078" y="210" fill="#FFFFFF">the benchmark model attempts</text>
    <text x="1078" y="232" fill="#FFFFFF">the task 3x, graded like Harbor</text>

    <rect x="1310" y="150" width="230" height="112" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1328" y="184" font-size="18" font-weight="700" fill="#0F172A">Harbor package</text>
    <text x="1328" y="210">spec, gold, tests, Dockerfile,</text>
    <text x="1328" y="232">cost and token telemetry</text>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none">
    <line x1="292" y1="206" x2="307" y2="206" marker-end="url(#arrow)"/>
    <line x1="542" y1="206" x2="557" y2="206" marker-end="url(#arrow)"/>
    <line x1="792" y1="206" x2="807" y2="206" marker-end="url(#arrow)"/>
    <line x1="1042" y1="206" x2="1057" y2="206" marker-end="url(#arrow)"/>
    <line x1="1292" y1="206" x2="1307" y2="206" marker-end="url(#arrow)"/>
    <!-- repair loop -->
    <path d="M925 262 V290 H700 V265" marker-end="url(#arrow)"/>
  </g>
  <text x="812" y="308" font-size="13" fill="#64748B" text-anchor="middle">failed gate: the exact failure goes back (max 3 tries)</text>
  <!-- jury loop -->
  <path d="M1175 262 V336 H650 V265" stroke="#1D6FD1" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="912" y="358" font-size="14.5" font-weight="600" fill="#1D6FD1" text-anchor="middle">solved more than 1 of 3: deepen with a depth mechanism, pass every gate again, measure again (max 2 rounds)</text>

  <!-- panel 1: difficulty -->
  <rect x="60" y="385" width="500" height="465" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="82" y="422" font-size="20" font-weight="700" fill="#0F172A">1  Difficulty is measured, then raised</text>
  <text x="82" y="446" font-size="14" fill="#64748B">Haiku 5.5 one-shot solves out of 3, graded in the task container</text>
  <text x="380" y="480" font-size="12.5" fill="#64748B" text-anchor="middle">before</text>
  <text x="470" y="480" font-size="12.5" fill="#64748B" text-anchor="middle">after deepening</text>
  <g font-size="15" fill="#0F172A">
    <!-- 0101 -->
    <text x="82" y="512" font-weight="700">0101 lifecycle hooks</text>
    <text x="82" y="531" font-size="12.5" fill="#1D6FD1" font-weight="600">deepened: state and re-entrancy</text>
    <circle cx="360" cy="512" r="8" fill="#334155"/><circle cx="380" cy="512" r="8" fill="#334155"/><circle cx="400" cy="512" r="8" fill="#334155"/>
    <circle cx="450" cy="512" r="8" fill="#334155"/>
    <circle cx="470" cy="512" r="7" fill="#FFFFFF" stroke="#1D6FD1" stroke-width="2.5"/>
    <circle cx="490" cy="512" r="7" fill="#FFFFFF" stroke="#1D6FD1" stroke-width="2.5"/>
    <text x="508" y="518" font-size="17" font-weight="700" fill="#1D6FD1">1/3</text>
    <!-- 0102 -->
    <text x="82" y="570" font-weight="700">0102 effective value in help</text>
    <text x="82" y="589" font-size="12.5" fill="#64748B">deepened, no harder: original kept</text>
    <circle cx="360" cy="570" r="8" fill="#334155"/><circle cx="380" cy="570" r="8" fill="#334155"/><circle cx="400" cy="570" r="8" fill="#334155"/>
    <circle cx="450" cy="570" r="8" fill="#334155"/><circle cx="470" cy="570" r="8" fill="#334155"/><circle cx="490" cy="570" r="8" fill="#334155"/>
    <text x="508" y="576" font-size="17" font-weight="700" fill="#334155">3/3</text>
    <!-- 0103 -->
    <text x="82" y="628" font-weight="700">0103 line completion</text>
    <text x="82" y="647" font-size="12.5" fill="#64748B">deepen answer cut off: original kept</text>
    <circle cx="360" cy="628" r="8" fill="#334155"/><circle cx="380" cy="628" r="8" fill="#334155"/><circle cx="400" cy="628" r="8" fill="#334155"/>
    <text x="470" y="633" font-size="13" fill="#94A3B8" text-anchor="middle">not measured</text>
    <!-- 0104 -->
    <text x="82" y="686" font-weight="700">0104 option shorthands</text>
    <text x="82" y="705" font-size="12.5" fill="#64748B">deepen answer cut off: original kept</text>
    <circle cx="360" cy="686" r="8" fill="#334155"/><circle cx="380" cy="686" r="8" fill="#334155"/><circle cx="400" cy="686" r="8" fill="#334155"/>
    <text x="470" y="691" font-size="13" fill="#94A3B8" text-anchor="middle">not measured</text>
    <!-- 0105 -->
    <text x="82" y="744" font-weight="700">0105 numbered choice menus</text>
    <text x="82" y="763" font-size="12.5" fill="#64748B">deepen answer cut off: original kept</text>
    <circle cx="360" cy="744" r="8" fill="#334155"/><circle cx="380" cy="744" r="8" fill="#334155"/><circle cx="400" cy="744" r="8" fill="#334155"/>
    <text x="470" y="749" font-size="13" fill="#94A3B8" text-anchor="middle">not measured</text>
  </g>
  <circle cx="90" cy="790" r="6" fill="#334155"/><text x="104" y="795" font-size="13" fill="#475569">solved</text>
  <circle cx="170" cy="790" r="5.5" fill="#FFFFFF" stroke="#1D6FD1" stroke-width="2"/><text x="184" y="795" font-size="13" fill="#475569">not solved</text>
  <text x="82" y="816" font-size="13.5" fill="#334155">Target: solved at most 1 time in 3 attempts.</text>
  <text x="82" y="836" font-size="13.5" fill="#334155">One measured attempt costs about 2 cents.</text>

  <!-- panel 2: variation -->
  <rect x="590" y="385" width="470" height="465" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="612" y="422" font-size="20" font-weight="700" fill="#0F172A">2  Variation is measured</text>
  <text x="612" y="446" font-size="14" fill="#64748B">Pairwise similarity: changed code, regression tests, spec terms</text>
  <g font-size="13" fill="#475569" text-anchor="middle">
    <text x="709" y="482">0101</text><text x="767" y="482">0102</text><text x="825" y="482">0103</text><text x="883" y="482">0104</text><text x="941" y="482">0105</text>
  </g>
  <g font-size="13" fill="#475569" text-anchor="end">
    <text x="670" y="524">0101</text><text x="670" y="582">0102</text><text x="670" y="640">0103</text><text x="670" y="698">0104</text><text x="670" y="756">0105</text>
  </g>
  <g stroke="#FFFFFF" stroke-width="2">
    <!-- row 0101 -->
    <rect x="680" y="490" width="58" height="58" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="738" y="490" width="58" height="58" fill="#D8E5F4"/>
    <rect x="796" y="490" width="58" height="58" fill="#E0EAF6"/>
    <rect x="854" y="490" width="58" height="58" fill="#DCE8F5"/>
    <rect x="912" y="490" width="58" height="58" fill="#E8F0F7"/>
    <!-- row 0102 -->
    <rect x="680" y="548" width="58" height="58" fill="#D8E5F4"/>
    <rect x="738" y="548" width="58" height="58" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="796" y="548" width="58" height="58" fill="#F1F5F9"/>
    <rect x="854" y="548" width="58" height="58" fill="#C2D8F0"/>
    <rect x="912" y="548" width="58" height="58" fill="#C2D8F0"/>
    <!-- row 0103 -->
    <rect x="680" y="606" width="58" height="58" fill="#E0EAF6"/>
    <rect x="738" y="606" width="58" height="58" fill="#F1F5F9"/>
    <rect x="796" y="606" width="58" height="58" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="854" y="606" width="58" height="58" fill="#F1F5F9"/>
    <rect x="912" y="606" width="58" height="58" fill="#F1F5F9"/>
    <!-- row 0104 -->
    <rect x="680" y="664" width="58" height="58" fill="#DCE8F5"/>
    <rect x="738" y="664" width="58" height="58" fill="#C2D8F0"/>
    <rect x="796" y="664" width="58" height="58" fill="#F1F5F9"/>
    <rect x="854" y="664" width="58" height="58" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="912" y="664" width="58" height="58" fill="#E8F0F7"/>
    <!-- row 0105 -->
    <rect x="680" y="722" width="58" height="58" fill="#E8F0F7"/>
    <rect x="738" y="722" width="58" height="58" fill="#C2D8F0"/>
    <rect x="796" y="722" width="58" height="58" fill="#F1F5F9"/>
    <rect x="854" y="722" width="58" height="58" fill="#E8F0F7"/>
    <rect x="912" y="722" width="58" height="58" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <g font-size="14" fill="#0F172A" text-anchor="middle">
    <text x="767" y="524">0.06</text><text x="825" y="524">0.04</text><text x="883" y="524">0.05</text><text x="941" y="524">0.02</text>
    <text x="709" y="582">0.06</text><text x="825" y="582">0.00</text><text x="883" y="582" font-weight="700">0.11</text><text x="941" y="582" font-weight="700">0.11</text>
    <text x="709" y="640">0.04</text><text x="767" y="640">0.00</text><text x="883" y="640">0.00</text><text x="941" y="640">0.00</text>
    <text x="709" y="698">0.05</text><text x="767" y="698" font-weight="700">0.11</text><text x="825" y="698">0.00</text><text x="941" y="698">0.02</text>
    <text x="709" y="756">0.02</text><text x="767" y="756" font-weight="700">0.11</text><text x="825" y="756">0.00</text><text x="883" y="756">0.02</text>
  </g>
  <text x="612" y="808" font-size="13.5" fill="#334155">Max 0.11, mean 0.04. A pair above 0.50 counts as a near-duplicate.</text>
  <text x="612" y="832" font-size="13.5" fill="#334155">Span-3 composites scored 0.69, so they are not the submitted set.</text>

  <!-- panel 3: proof -->
  <rect x="1090" y="385" width="470" height="465" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1112" y="422" font-size="20" font-weight="700" fill="#0F172A">3  Every package is proven before it ships</text>
  <text x="1112" y="446" font-size="14" fill="#64748B">Checked by the pipeline itself; no package was edited by hand</text>
  <g font-size="15" fill="#0F172A">
    <g fill="#15803D">
      <circle cx="1122" cy="487" r="9"/><circle cx="1122" cy="527" r="9"/><circle cx="1122" cy="567" r="9"/><circle cx="1122" cy="607" r="9"/>
      <circle cx="1122" cy="647" r="9"/><circle cx="1122" cy="687" r="9"/><circle cx="1122" cy="727" r="9"/><circle cx="1122" cy="767" r="9"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1117.5 487 l3.2 3.4 l5.8 -6.6"/><path d="M1117.5 527 l3.2 3.4 l5.8 -6.6"/><path d="M1117.5 567 l3.2 3.4 l5.8 -6.6"/><path d="M1117.5 607 l3.2 3.4 l5.8 -6.6"/>
      <path d="M1117.5 647 l3.2 3.4 l5.8 -6.6"/><path d="M1117.5 687 l3.2 3.4 l5.8 -6.6"/><path d="M1117.5 727 l3.2 3.4 l5.8 -6.6"/><path d="M1117.5 767 l3.2 3.4 l5.8 -6.6"/>
    </g>
    <text x="1142" y="492">Gold scores 1.0, the untouched repo scores 0.0</text>
    <text x="1142" y="532">Regression slice picked by coverage: 19 to 80 tests</text>
    <text x="1142" y="572">Mutation: 9 to 12 of 12 broken golds are caught</text>
    <text x="1142" y="612">Novel: feature tests fail on live upstream main</text>
    <text x="1142" y="652">Fair: asserted wording must appear in the spec</text>
    <text x="1142" y="692">Stable: repeats, reversed order, narrow terminal</text>
    <text x="1142" y="732">Yield: 5 of 5 valid, in both runs</text>
    <text x="1142" y="772">Linux + Harbor: oracle 1.0, nop 0.0 for all 5</text>
  </g>
  <text x="1112" y="808" font-size="13.5" fill="#334155">Hard spend cap per run. Every model call is logged.</text>
  <text x="1112" y="832" font-size="13.5" fill="#334155">In the task image: click's full suite, 2,434 passed, 0 failed.</text>

  <text x="60" y="882" font-size="13" fill="#94A3B8">Numbers from our own runs on 2026-11-14 (run 1 $10.95, probe $1.80, run 2 with the jury $11.01).</text>
</svg>
